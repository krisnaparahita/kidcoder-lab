<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KidCoder Lab — Learn coding, step by step</title>
  <meta name="description" content="An offline-first learning platform for kids aged 6+: pixel drawing, robot command blocks, logic puzzles and real Python. Profiles are saved in the browser." />
  <meta name="theme-color" content="#5c7cfa" />
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>" />
</head>
<body>
  <div id="app"></div>

  <noscript>
    <div style="padding:24px;font-family:sans-serif">
      KidCoder Lab needs JavaScript to run.
    </div>
  </noscript>

  <!-- core -->
  <script src="js/core/util.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/audio.js"></script>

  <!-- engines -->
  <script src="js/engines/grid.js"></script>
  <script src="js/engines/robot-sim.js"></script>
  <script src="js/engines/minipy.js"></script>

  <!-- content -->
  <script src="js/data/sprites.js"></script>
  <script src="js/data/registry.js"></script>
  <script src="js/data/curriculum.js"></script>

  <!-- progress rules depend on the curriculum -->
  <script src="js/core/progress.js"></script>
  <script src="js/data/ex-pixel.js"></script>
  <script src="js/data/ex-robot.js"></script>
  <script src="js/data/ex-logic.js"></script>
  <script src="js/data/ex-python.js"></script>

  <!-- ui -->
  <script src="js/ui/render-pixel.js"></script>
  <script src="js/ui/render-robot.js"></script>
  <script src="js/ui/render-logic.js"></script>
  <script src="js/ui/render-python.js"></script>
  <script src="js/ui/runner.js"></script>
  <script src="js/ui/home.js"></script>

  <!-- boot -->
  <script src="js/core/app.js"></script>
</body>
</html>
